services:
  mongodb:
    image: mongo:6
    restart: always
    ports:
      - "27017:27017"
    env_file:
      - ../.env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "bash", "-lc", "mongosh -u $MONGO_INITDB_ROOT_USERNAME -p $MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --quiet --eval 'db.adminCommand({ ping: 1 })' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  migration:
    build:
      context: .
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      MONGO_URI: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=${MONGO_DB}
      MONGO_HOST: ${MONGO_HOST:-mongodb}
      MONGO_PORT: ${MONGO_PORT:-27017}
    volumes:
      - ./data:/app/data
    command:
      - python
      - migration_crud.py
      - import_csv
      - --file
      - data/healthcare_dataset_purge.csv
      - --uri
      - mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=${MONGO_DB}
      - --db
      - ${MONGO_DB}
      - --collection
      - ${MONGO_COLLECTION}

  routines:
    build:
      context: .
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      MONGO_URI: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=${MONGO_DB}
      MONGO_HOST: ${MONGO_HOST:-mongodb}
      MONGO_PORT: ${MONGO_PORT:-27017}
    volumes:
      - ./routines:/app/routines
    working_dir: /app/routines
    entrypoint: ["tail", "-f", "/dev/null"]

  dataflow:
    build:
      context: .
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      MONGO_URI: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=${MONGO_DB}
      MONGO_HOST: ${MONGO_HOST:-mongodb}
      MONGO_PORT: ${MONGO_PORT:-27017}
    volumes:
      - .:/app
      - ../scripts:/app/scripts:ro
    entrypoint: ["tail", "-f", "/dev/null"]

volumes:
  mongo_data:
